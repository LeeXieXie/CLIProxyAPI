name: sync-upstream-feature-release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate sync without pushing branches, tags, or releases"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      release:
        description: "Trigger goreleaser after syncing"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      tag_suffix:
        description: "Suffix appended to upstream tag"
        required: false
        default: "persist"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-feature-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: router-for-me/CLIProxyAPI
  FEATURE_BRANCH: feat/usage-persistence-plugin
  TAG_SUFFIX: persist

jobs:
  sync-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and fork branches
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream main
          git fetch origin main "${FEATURE_BRANCH}"

      - name: Detect upstream changes
        id: detect
        run: |
          set -euo pipefail
          dry_run="${{ inputs.dry_run || 'false' }}"

          if git merge-base --is-ancestor upstream/main origin/main && [ "${dry_run}" != "true" ] && [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
            echo "reason=origin/main already contains upstream/main" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "should_run=true" >> "${GITHUB_OUTPUT}"
          echo "reason=upstream/main changed, manual run, or dry-run validation" >> "${GITHUB_OUTPUT}"

      - name: Merge upstream main into fork main
        if: ${{ steps.detect.outputs.should_run == 'true' }}
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          git merge --no-edit upstream/main
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            echo "Dry-run: not pushing main."
          else
            git push origin main
          fi

      - name: Merge upstream main into feature branch
        if: ${{ steps.detect.outputs.should_run == 'true' }}
        run: |
          set -euo pipefail
          git checkout -B "${FEATURE_BRANCH}" "origin/${FEATURE_BRANCH}"
          git merge --no-edit upstream/main
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            echo "Dry-run: not pushing ${FEATURE_BRANCH}."
          else
            git push origin "${FEATURE_BRANCH}"
          fi

      - name: Create unique release tag
        if: ${{ steps.detect.outputs.should_run == 'true' && (inputs.dry_run || 'false') != 'true' }}
        id: tag
        run: |
          set -euo pipefail
          suffix="${{ inputs.tag_suffix || env.TAG_SUFFIX }}"
          base_tag="$(git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPO}.git" 'v*' \
            | awk '{print $2}' \
            | sed 's#refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1)"
          if [ -z "${base_tag}" ]; then
            echo "No upstream semver tag found" >&2
            exit 1
          fi

          sha="$(git rev-parse --short HEAD)"
          ts="$(date -u +%Y%m%d-%H%M%S)"
          tag="${base_tag}-${suffix}.${ts}.${sha}"

          git tag "${tag}"
          git push origin "refs/tags/${tag}"

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Trigger goreleaser workflow
        if: ${{ steps.detect.outputs.should_run == 'true' && (inputs.dry_run || 'false') != 'true' && (github.event_name == 'schedule' || inputs.release == 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run release.yaml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f release_tag="${{ steps.tag.outputs.tag }}"

      - name: Summary
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          ## Sync upstream feature release

          - Upstream: ${UPSTREAM_REPO}
          - Feature branch: ${FEATURE_BRANCH}
          - Dry-run: ${{ inputs.dry_run || 'false' }}
          - Should run: ${{ steps.detect.outputs.should_run }}
          - Reason: ${{ steps.detect.outputs.reason }}
          - Release tag: ${{ steps.tag.outputs.tag }}
          - Release triggered: ${{ steps.detect.outputs.should_run == 'true' && (inputs.dry_run || 'false') != 'true' && (github.event_name == 'schedule' || inputs.release == 'true') }}
          EOF
